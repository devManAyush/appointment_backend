spring:
  application:
    name: appointment_backend
  datasource:
    url: jdbc:mysql://localhost:3307/appointment_db
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
security:
  jwt:
    secret: ${JWT_SECRET}
app:
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}